[package]
name = "jsonld-fast-core"
description = "Streaming JSON-LD 1.1, YAML-LD, and RDF-Star codec with deterministic canonicalization"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
keywords = ["json-ld", "jsonld", "linked-data", "streaming", "yaml-ld"]
categories = ["encoding", "parser-implementations"]

[lib]
name = "jsonld_fast_core"

[dependencies]
arrow-array = { workspace = true }
oxrdf = { workspace = true }
quad-fast-core = { workspace = true }
saphyr = "0.0.12"
saphyr-parser = "0.0.12"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "jsonld"
harness = false

[lints]
workspace = true
