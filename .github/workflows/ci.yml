name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      # jelly-fast-core's build script compiles the Jelly schemas with protoc.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      # jelly-fast-core's build script compiles the Jelly schemas with protoc.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: ./scripts/build-node.sh
      - run: node scripts/smoke-node.mjs
      - run: node quad-fast-node/smoke.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      # jelly-fast-core's build script compiles the Jelly schemas with protoc.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: astral-sh/setup-uv@v5
      - run: cd quad-fast-py && uv run pytest tests/

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests -q
