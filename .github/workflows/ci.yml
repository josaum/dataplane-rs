# Every push to main and every pull request: the workspace must format, lint
# clean and pass, and the Python and Node bindings must build and pass their
# suites. release.yml calls this file as its `verify` job.
#
# Every third-party action is pinned to a full commit SHA, with its version in
# the trailing comment; Dependabot moves both. The token is read-only: nothing
# here publishes anything. Dependency advisories are checked in audit.yml, not
# here, so a new advisory cannot block the release of an unrelated fix.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      # jelly-fast-core's build script compiles the Jelly schemas with protoc.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  # The public API documentation must build: a broken intra-doc link, or one
  # to a private item, fails here instead of on docs.rs or in a reader's IDE.
  # All features, so the feature-gated items are documented too.
  rustdoc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --locked --all-features

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      # jelly-fast-core's build script compiles the Jelly schemas with protoc.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - shell: bash
        run: ./scripts/build-node.sh
      - run: node scripts/smoke-node.mjs
      - run: node quad-fast-node/smoke.test.mjs
      # Rebuild with the panic probe (never part of a release) and require a
      # Rust panic to reach JS as a thrown Error, not abort the process.
      - shell: bash
        run: NODE_CARGO_FEATURES=quad-fast-node/panic-probe ./scripts/build-node.sh quad-fast-node
      - run: node quad-fast-node/panic.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      # jelly-fast-core's build script compiles the Jelly schemas with protoc.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Built with the panic probe (never part of a release), so test_panic.py
      # proves a Rust panic reaches Python as an exception.
      - run: cd quad-fast-py && uv run pytest tests/
        env:
          MATURIN_PEP517_ARGS: --features panic-probe
          QUAD_FAST_REQUIRE_PANIC_PROBE: "1"

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # tests/ holds the release tooling tests and the workflow contracts
      # (test_workflow_hardening.py), which read the workflows with PyYAML.
      - run: python -m pip install "pytest==9.1.1" "pyyaml==6.0.3"
      - run: python -m pytest tests -q
